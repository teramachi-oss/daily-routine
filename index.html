<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DAILY CORE</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap');

  :root {
    --bg:     #0A0F1E;
    --card:   #111827;
    --card2:  #161f30;
    --border: #1e2a3a;
    --text:   #FFFFFF;
    --sub:    #6B7A99;
    --blue:   #3B82F6;
    --orange: #F97316;
    --cyan:   #0EA5E9;
    --track:  #1a2235;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Zen Kaku Gothic New',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:28px 18px 80px;
    max-width:560px;
    margin:0 auto;
  }

  .topbar { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; }
  .kicker { font-family:'Bricolage Grotesque',sans-serif; font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--blue); font-weight:800; }
  h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:32px; line-height:1.05; margin:4px 0 0; letter-spacing:-0.02em; }
  .streak { text-align:right; line-height:1; flex-shrink:0; }
  .streak .num { font-family:'Bricolage Grotesque',sans-serif; font-size:44px; font-weight:800; color:var(--blue); }
  .streak .lbl { font-size:10px; letter-spacing:0.18em; color:var(--sub); text-transform:uppercase; }

  .nudge { padding:12px 15px; border-radius:12px; margin-bottom:16px; font-size:13px; font-weight:500; border:1px solid var(--border); }
  .nudge.morning { color:var(--orange); border-color:rgba(249,115,22,0.3); background:rgba(249,115,22,0.06); }
  .nudge.night   { color:var(--blue);   border-color:rgba(59,130,246,0.3);  background:rgba(59,130,246,0.06); }
  .nudge.idle    { color:var(--sub);    border-color:var(--border);          background:var(--card); }

  .weekstrip { display:flex; gap:5px; margin-bottom:20px; }
  .wd { flex:1; text-align:center; padding:8px 2px; border-radius:10px; background:var(--card); border:1px solid var(--border); }
  .wd .d    { font-size:11px; font-weight:700; color:var(--sub); }
  .wd .type { font-size:10px; margin-top:3px; color:var(--sub); font-weight:600; }
  .wd.today { background:var(--blue); border-color:var(--blue); }
  .wd.today .d, .wd.today .type { color:#fff; }

  .ring-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; display:flex; align-items:center; gap:20px; margin-bottom:16px; }
  .ring-wrap { position:relative; flex-shrink:0; }
  svg.ring { transform:rotate(-90deg); }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-num { font-family:'Bricolage Grotesque',sans-serif; font-size:36px; font-weight:800; line-height:1; }
  .ring-lbl { font-size:10px; color:var(--sub); letter-spacing:1px; margin-top:2px; }
  .ring-max { font-size:9px; color:var(--sub); margin-top:2px; }
  .progress-wrap { flex:1; }
  .progress-meta { display:flex; justify-content:space-between; margin-bottom:8px; }
  .done-label { font-size:12px; font-weight:600; color:var(--text); }
  .date-label { font-size:11px; color:var(--sub); }
  .progress-track { height:8px; background:var(--track); border-radius:20px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:var(--blue); border-radius:20px; transition:width 0.5s cubic-bezier(.2,.8,.2,1); }

  .day-label { font-size:13px; color:var(--sub); margin-bottom:4px; }

  .done-banner { text-align:center; padding:16px; border-radius:14px; background:linear-gradient(135deg,#0f3460,#1a4a8a); font-weight:700; font-size:15px; margin-bottom:22px; display:none; }
  .done-banner.show { display:block; }

  .block-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; margin-top:20px; }
  .block-head .lbl { font-size:15px; font-weight:700; }
  .tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:0.05em; border:1px solid; }
  .tag.core    { color:var(--blue);   background:rgba(59,130,246,0.1);  border-color:rgba(59,130,246,0.25); }
  .tag.train   { color:var(--cyan);   background:rgba(14,165,233,0.1);  border-color:rgba(14,165,233,0.25); }
  .tag.stretch { color:var(--orange); background:rgba(249,115,22,0.1);  border-color:rgba(249,115,22,0.25); }
  .block-head .min { font-size:11px; color:var(--sub); }
  .block-head .bar { flex:1; height:1px; background:var(--border); }

  .item { display:flex; align-items:flex-start; gap:13px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 15px; margin-bottom:8px; cursor:pointer; transition:border-color 0.2s,background 0.2s; }
  .item:active { opacity:0.85; }
  .item.done { background:var(--card2); border-color:#1e3048; }
  .item.done .name { color:var(--sub); text-decoration:line-through; }
  .check { width:24px; height:24px; border-radius:8px; flex-shrink:0; border:2px solid var(--border); display:grid; place-items:center; transition:all 0.2s; margin-top:1px; }
  .item.done .check { background:var(--blue); border-color:var(--blue); }
  .check svg { width:14px; height:14px; stroke:#fff; stroke-width:3.5; fill:none; opacity:0; transform:scale(0.5); transition:all 0.2s; }
  .item.done .check svg { opacity:1; transform:scale(1); }
  .name { font-size:15px; font-weight:500; line-height:1.35; }
  .detail { font-size:12px; color:var(--sub); margin-top:3px; line-height:1.4; }

  .badges-sec { margin-top:30px; }
  .badges-sec h2 { font-family:'Bricolage Grotesque',sans-serif; font-size:15px; font-weight:800; letter-spacing:0.04em; margin-bottom:4px; }
  .badges-sec .note { font-size:11px; color:var(--sub); margin-bottom:14px; }
  .badge-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .badge { text-align:center; padding:13px 6px; border-radius:13px; background:var(--card); border:1px solid var(--border); position:relative; opacity:0.4; }
  .badge.unlocked { opacity:1; background:#0f1f35; border-color:var(--blue); }
  .badge.next-badge { opacity:0.75; border:1.5px dashed var(--orange); }
  .badge.next-badge::after { content:'あと'attr(data-left)'日'; position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:var(--orange); color:#fff; font-size:9px; font-weight:700; padding:1px 7px; border-radius:10px; white-space:nowrap; }
  .badge-days { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:18px; color:var(--sub); line-height:1; }
  .badge.unlocked .badge-days { color:var(--blue); }
  .badge-unit { font-size:8px; font-weight:700; color:var(--sub); letter-spacing:1px; margin-top:1px; }
  .badge-cap { font-size:9px; color:var(--sub); margin-top:3px; }

  .reset { display:block; margin:22px auto 0; background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer; font-family:inherit; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; place-items:center; z-index:50; padding:24px; }
  .modal-bg.show { display:grid; }
  .modal { background:var(--card); border-radius:20px; padding:32px 26px; text-align:center; max-width:340px; width:100%; border:1.5px solid var(--blue); }
  .modal h3 { font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:800; margin-bottom:6px; }
  .modal p { font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:20px; }
  .modal button { background:var(--blue); color:#fff; border:none; padding:12px 28px; border-radius:30px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="kicker">HABIT TRACKER</div>
    <h1>DAILY<br>CORE</h1>
  </div>
  <div class="streak"><div class="num" id="streakNum">0</div><div class="lbl">日連続</div></div>
</div>

<div class="nudge idle" id="nudge"><span id="nudgeText">読み込み中…</span></div>

<div class="weekstrip" id="weekstrip"></div>

<div class="ring-card">
  <div class="ring-wrap">
    <svg class="ring" width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" stroke="#1a2235" stroke-width="10" fill="none"/>
      <circle cx="60" cy="60" r="52" stroke="#3B82F6" stroke-width="10" fill="none"
        stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" id="ringArc"/>
    </svg>
    <div class="ring-center">
      <div class="ring-num" id="ringNum">0</div>
      <div class="ring-lbl">日連続</div>
      <div class="ring-max" id="ringMax"></div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="done-label" id="progressText">0 / 4 完了</span>
      <span class="date-label" id="dateText"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
  </div>
</div>

<div class="done-banner" id="banner">今日の分、完了。連続記録が伸びました</div>
<div class="day-label" id="dayLabel"></div>
<div id="app"></div>

<div class="badges-sec">
  <h2>連続バッジ</h2>
  <div class="note">節目で解放。一度取ったバッジは消えません。</div>
  <div class="badge-grid" id="badgeGrid"></div>
</div>

<button class="reset" id="resetBtn">今日のチェックをリセット</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <button id="modalClose">よし！</button>
  </div>
</div>

<script>
const CORE = { label:'毎日の土台', tag:'core', tagText:'CORE', min:'約4分', items:[
  { id:'c1', name:'プランク 1分', detail:'お尻を締めお腹を引き込む。腰を反らさない' },
  { id:'c2', name:'のが腹筋 3分（地獄の3分）', detail:'クランチ〜カーヴィークランチ6種。回数より丁寧に' },
]};
const T_SQUAT   = { id:'sq',    name:'BPMスクワット（体脂肪燃焼）',     detail:'心拍を上げる有酸素枠。膝をつま先より前に出しすぎない' };
const T_PUSH    = { id:'pu',    name:'のが腕立て 4種',                   detail:'胸を開く動き。苦手なら膝つきでOK' };
const S_LOWBACK = { id:'st_lb', name:'オガトレ 腰痛ストレッチ（12分/8分）', detail:'骨盤〜背骨。腸腰筋・裏ももをゆるめ姿勢を立てる' };
const S_SHLDR   = { id:'st_sh', name:'オガトレ 巻き肩ストレッチ（9分）',   detail:'胸を伸ばし肩を後ろへ。猫背・前肩の根本対策' };
const S_NIGHT   = { id:'st_ng', name:'オガトレ 夜の全身ストレッチ（9分）', detail:'リラックスして疲労リセット。寝つきUP' };

const WEEK = {
  0:{type:'脚', label:'下半身＋夜ST',  train:T_SQUAT, stretch:S_NIGHT},
  1:{type:'脚', label:'下半身＋腰痛',  train:T_SQUAT, stretch:S_LOWBACK},
  2:{type:'腕', label:'上半身＋巻き肩', train:T_PUSH,  stretch:S_SHLDR},
  3:{type:'脚', label:'下半身＋夜ST',  train:T_SQUAT, stretch:S_NIGHT},
  4:{type:'腕', label:'上半身＋巻き肩', train:T_PUSH,  stretch:S_SHLDR},
  5:{type:'脚', label:'下半身＋腰痛',  train:T_SQUAT, stretch:S_LOWBACK},
  6:{type:'腕', label:'上半身＋巻き肩', train:T_PUSH,  stretch:S_SHLDR},
};
const WD_LABEL = ['日','月','火','水','木','金','土'];
const BADGES = [
  {d:3,label:'3日'},{d:7,label:'1週間'},{d:14,label:'2週間'},
  {d:21,label:'習慣化'},{d:30,label:'1ヶ月'},{d:50,label:'50日'},{d:100,label:'100日'},
];
const CIRCUMFERENCE = 2 * Math.PI * 52;
const MAX_STREAK = 30;

const todayKey = () => new Date().toLocaleDateString('sv-SE');
const dow = () => new Date().getDay();
let state = { checks:{}, streak:0, maxStreak:0, lastDone:null, checksDate:null, earned:[] };

function plan(){ return WEEK[dow()]; }
function currentItems(){ return [...CORE.items, plan().train, plan().stretch]; }
function coreDone(){ return CORE.items.every(it=>state.checks[it.id]); }

async function load(){
  try{ const r=localStorage.getItem('routine-v5'); if(r) state=JSON.parse(r); }catch(e){}
  if(!state.earned) state.earned=[];
  if(state.checksDate!==todayKey()){ state.checks={}; state.checksDate=todayKey(); }
  render();
}
function save(){ try{ localStorage.setItem('routine-v5', JSON.stringify(state)); }catch(e){} }

function refreshStreak(){
  const yest=new Date(Date.now()-86400000).toLocaleDateString('sv-SE');
  if(coreDone() && state.lastDone!==todayKey()){
    state.streak=(state.lastDone===yest)?state.streak+1:1;
    state.lastDone=todayKey();
    state.maxStreak=Math.max(state.maxStreak||0,state.streak);
    document.getElementById('banner').classList.add('show');
    for(const b of BADGES){
      if(state.streak>=b.d && !state.earned.includes(b.d)){
        state.earned.push(b.d);
        document.getElementById('modalTitle').textContent=`${b.d}日連続達成！`;
        document.getElementById('modalBody').textContent=`バッジ「${b.label}」を解放しました。この調子！`;
        document.getElementById('modalBg').classList.add('show');
      }
    }
  } else if(!coreDone() && state.lastDone===todayKey()){
    state.lastDone=(state.streak>0)?yest:null;
    state.streak=Math.max(0,state.streak-1);
    document.getElementById('banner').classList.remove('show');
  }
}

function toggle(id){ state.checks[id]=!state.checks[id]; refreshStreak(); save(); render(); }
function reset(){
  currentItems().forEach(it=>delete state.checks[it.id]);
  if(state.lastDone===todayKey()){ state.lastDone=null; state.streak=Math.max(0,state.streak-1); }
  document.getElementById('banner').classList.remove('show');
  save(); render();
}

function blockHTML(label, tag, tagText, min, items){
  return `<div>
    <div class="block-head"><span class="lbl">${label}</span><span class="tag ${tag}">${tagText}</span><span class="min">${min}</span><span class="bar"></span></div>
    ${items.map(it=>`<div class="item ${state.checks[it.id]?'done':''}" data-id="${it.id}">
      <div class="check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
      <div><div class="name">${it.name}</div><div class="detail">${it.detail}</div></div></div>`).join('')}
  </div>`;
}

function render(){
  const p=plan(); const today=dow();
  document.getElementById('weekstrip').innerHTML=
    [1,2,3,4,5,6,0].map(d=>`<div class="wd ${d===today?'today':''}"><div class="d">${WD_LABEL[d]}</div><div class="type">${WEEK[d].type}</div></div>`).join('');

  const h=new Date().getHours();
  const el=document.getElementById('nudge');
  el.className='nudge';
  if(h>=6&&h<14){el.classList.add('morning');document.getElementById('nudgeText').textContent='朝の時間。まずは筋トレからいきましょう';}
  else if(h>=18||h<2){el.classList.add('night');document.getElementById('nudgeText').textContent='夜の時間。ストレッチで1日をリセット';}
  else{el.classList.add('idle');document.getElementById('nudgeText').textContent='今日のメニュー、まだの分があればどうぞ';}

  const offset=CIRCUMFERENCE*(1-Math.min(1,state.streak/MAX_STREAK));
  document.getElementById('ringArc').style.strokeDashoffset=offset;
  document.getElementById('ringNum').textContent=state.streak;
  document.getElementById('ringMax').textContent=state.maxStreak>0?`最高 ${state.maxStreak}日`:'';

  const app=document.getElementById('app');
  app.innerHTML=
    blockHTML('毎日の土台','core','CORE','約4分',CORE.items)+
    blockHTML('今日の筋トレ','train','TRAIN','有酸素・脂肪燃焼',[p.train])+
    blockHTML('今日のストレッチ','stretch','STRETCH','夜・温まってから',[p.stretch]);
  app.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>toggle(el.dataset.id)));

  const items=currentItems();
  const done=items.filter(it=>state.checks[it.id]).length;
  document.getElementById('fill').style.width=(done/items.length*100)+'%';
  document.getElementById('progressText').textContent=`${done} / ${items.length} 完了${coreDone()?' · 土台クリア':''}`;
  document.getElementById('streakNum').textContent=state.streak;
  document.getElementById('dayLabel').textContent=`${WD_LABEL[today]}曜 · ${p.label}の日`;
  document.getElementById('dateText').textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  if(coreDone()) document.getElementById('banner').classList.add('show');

  const next=BADGES.find(b=>!state.earned.includes(b.d));
  document.getElementById('badgeGrid').innerHTML=BADGES.map(b=>{
    const got=state.earned.includes(b.d);
    const isNext=next&&next.d===b.d;
    const left=isNext?Math.max(1,b.d-state.streak):0;
    return `<div class="badge ${got?'unlocked':''} ${isNext?'next-badge':''}" ${isNext?`data-left="${left}"`:''}>
      <div class="badge-days">${b.d}</div><div class="badge-unit">DAY</div><div class="badge-cap">${b.label}</div></div>`;
  }).join('');
}

document.getElementById('resetBtn').addEventListener('click',reset);
document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalBg').classList.remove('show'));
load();
</script>
</body>
</html>
